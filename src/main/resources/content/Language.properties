auth0-integration-configuration-name=Auth0 — Integración Circulo de Atención

category.circulo-configuracion-auth0=Circulo-Configuracion-Auth0
category-section.circulo-autenticacion=Circulo-Autenticacion

auth0-domain=Dominio Tenant de Auth0
auth0-domain-help=El dominio de tu tenant en Auth0 (ej. mi-tenant.us.auth0.com). Usado para resolver el descubrimiento de OpenID Connect y llamadas a la API interna.

auth0-custom-domain=Dominio Personalizado Auth0
auth0-custom-domain-help=Dominio personalizado en Auth0 para la experiencia de inicio de sesión (ej. login.circulo.com). Si se deja en blanco, se utilizará el dominio del Tenant.

client-id=Client ID (App)
client-id-help=El identificador del cliente (Client ID) proporcionado por Auth0 para esta aplicación específica.

client-secret=Client Secret
client-secret-help=El secreto del cliente (Client Secret) proporcionado por Auth0. Necesario para el intercambio seguro del código por los tokens.

redirect-uri=URI de Redirección (Callback)
redirect-uri-help=La URL completa a la cual Auth0 redirigirá al usuario tras un login exitoso (ej. https://portal.circulo.com/o/auth/callback). Debe coincidir exactamente con la configurada en Auth0.

logout-return-uri=URI de Retorno (Logout)
logout-return-uri-help=La URL completa a la cual Auth0 redirigirá al usuario después de cerrar su sesión (ej. https://portal.circulo.com/c/portal/logout).

audience=Audiencia de API (Audience)
audience-help=El identificador de la API registrada en Auth0, necesario si se requieren tokens de acceso para consumir APIs externas (ej. https://api.circulo.com).

scopes=Alcances (Scopes) OIDC
scopes-help=Los permisos solicitados durante la autenticación. Mínimo debe contener "openid profile email" para que el portal obtenga la información necesaria del usuario.

jwks-uri=URI de JWKS (Opcional)
jwks-uri-help=URL directa para obtener las llaves públicas de firma (JSON Web Key Set). Si se deja en blanco, se infiere a partir del dominio Auth0.

cookies-secure=Cookies Secure (HTTPS)
cookies-secure-help=Indica si las cookies de sesión del portal deben marcarse como Secure. Activar obligatoriamente en DEV, QA y PROD (con HTTPS). Desactivar únicamente en desarrollo local (HTTP).

post-login-redirect-path=Ruta de éxito post-login
post-login-redirect-path-help=Ruta relativa del portal donde se enviará al usuario después de autenticarse y procesar correctamente su acceso (ej. /group/guest/home).

cookie-same-site=Política SameSite en cookies
cookie-same-site-help=Regula el envío de cookies cross-site. Valores: "lax" (recomendado, protege de CSRF), "strict", o "none". "none" exige que las cookies sean Secure (HTTPS). Si se deja en blanco, se omite.

portal-access-app-claim-uri=URI del claim de aplicación autorizada
portal-access-app-claim-uri-help=El espacio de nombres o URI del claim inyectado en el ID Token que define para qué aplicación tiene permiso el usuario (ej. https://circulo.com/app).

portal-expected-app=Valor esperado de la aplicación
portal-expected-app-help=El valor exacto que se debe buscar dentro del claim anterior para permitir el acceso (ej. portal, backoffice). Si el token no tiene este valor, se bloquea el acceso.

portal-roles-claim-uri=URI del claim de roles de usuario
portal-roles-claim-uri-help=El espacio de nombres o URI del claim en el ID Token que contiene el listado o arreglo de roles asignados al usuario (ej. https://circulo.com/roles).

portal-allowed-roles=Roles autorizados para acceso
portal-allowed-roles-help=Lista separada por comas de los roles que pueden entrar al portal (ej. portal:agent,portal:agent:editor,backoffice:canales:lector,backoffice:ingresos:lector). El usuario debe tener al menos uno para ingresar (no distingue mayúsculas/minúsculas).

auth-bridge-data-claim-uri=URI del claim de datos de Auth-Bridge
auth-bridge-data-claim-uri-help=El espacio de nombres o URI del claim que contiene el objeto con datos estructurados inyectados por auth-bridge (nombre, apellidos, rut, correo, etc.).

auth0-oauth-error-page-path=Página del portal para errores de OAuth
auth0-oauth-error-page-path-help=Ruta relativa de la página de Liferay que contiene el portlet React encargado de desplegar errores provenientes del login de Auth0 (ej. /web/guest/error-auth).

auth0-email-not-verified-page-path=Página de error de Email no verificado
auth0-email-not-verified-page-path-help=Ruta relativa de la página en Liferay a la que se envía al usuario si la regla de Auth0 rechaza el inicio de sesión indicando que no ha validado su correo electrónico (ej. /web/guest/email-no-verificado).

token-encryption-key=Clave de cifrado para tokens (AES)
token-encryption-key-help=Clave secreta (mínimo de 32 caracteres) usada por Liferay para cifrar de manera segura el Access Token y Refresh Token en las cookies o en base de datos. Debe ser idéntica en todos los nodos de un clúster.
